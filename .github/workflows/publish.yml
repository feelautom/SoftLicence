name: Test & Publish NuGet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test-and-publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/SoftLicence.sln

      - name: Restore test dependencies
        run: dotnet restore tests/SoftLicence.Tests/SoftLicence.Tests.csproj

      - name: Run tests
        run: dotnet test tests/SoftLicence.Tests/ --no-restore --verbosity normal

      - name: Build solution
        run: dotnet build src/SoftLicence.sln -c Release --no-restore

      - name: Determine SDK package version
        id: sdk_version
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $releaseTag = "${{ github.event.release.tag_name }}"

          if ($eventName -eq "release") {
              if ([string]::IsNullOrWhiteSpace($releaseTag)) {
                  throw "Release event did not provide a tag name."
              }

              if ($releaseTag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z\.-]+)?)$') {
                  throw "Release tag '$releaseTag' must use vX.Y.Z format, for example v1.1.9."
              }

              $version = $Matches["version"]
          }
          else {
              [xml]$project = Get-Content "src/SoftLicence.SDK/SoftLicence.SDK.csproj"
              $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
              if ([string]::IsNullOrWhiteSpace($version)) {
                  throw "Could not read SDK version from csproj for non-release CI pack."
              }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SDK package version: $version"

      - name: Verify NuGet version is not already published
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = "${{ steps.sdk_version.outputs.version }}"
          $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/softlicence.sdk/index.json"
          if ($index.versions -contains $version) {
              throw "SoftLicence.SDK $version is already published on NuGet. NuGet packages are immutable."
          }
          Write-Host "SoftLicence.SDK $version is not published yet."

      - name: Verify no open pull request is pending
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = "${{ github.repository }}"
          $pullRequests = Invoke-RestMethod "https://api.github.com/repos/$repo/pulls?state=open&per_page=100" -Headers $headers
          if ($pullRequests.Count -gt 0) {
              $summary = ($pullRequests | ForEach-Object { "#$($_.number) $($_.title) - $($_.html_url)" }) -join "; "
              throw "Open pull requests block SDK release publication: $summary"
          }

          Write-Host "No open pull request blocks the SDK release."

      - name: Pack SDK
        run: dotnet pack src/SoftLicence.SDK/SoftLicence.SDK.csproj -c Release -o out -p:PackageVersion=${{ steps.sdk_version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Verify package version and scan package metadata
        shell: pwsh
        run: |
          $version = "${{ steps.sdk_version.outputs.version }}"
          $expectedName = "SoftLicence.SDK.$version.nupkg"
          $packages = @(Get-ChildItem -Path out -Filter *.nupkg)

          if ($packages.Count -ne 1) {
              throw "Expected exactly one nupkg in out, found $($packages.Count)."
          }

          if ($packages[0].Name -ne $expectedName) {
              throw "Package name mismatch. Expected '$expectedName', got '$($packages[0].Name)'."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
              $entries = $zip.Entries | Sort-Object FullName
              $entries | ForEach-Object { Write-Host "PACKAGE_ENTRY $($_.FullName) $($_.Length)" }

              $allowed = @(
                  "_rels/.rels",
                  "[Content_Types].xml",
                  "LICENSE",
                  "PACKAGE_README.md",
                  "SoftLicence.SDK.nuspec",
                  "icon.png",
                  "lib/netstandard2.0/SoftLicence.SDK.dll"
              )

              foreach ($entry in $entries) {
                  $isAllowed = $allowed -contains $entry.FullName `
                      -or $entry.FullName -like "package/services/metadata/core-properties/*.psmdcp"
                  if (-not $isAllowed) {
                      throw "Unexpected file in NuGet package: $($entry.FullName)"
                  }
              }

              $secretPattern = '(?i)(api[_-]?key\s*[=:]\s*[^\s"'']+|secret\s*[=:]\s*[^\s"'']+|password\s*[=:]\s*[^\s"'']+|bearer\s+[a-z0-9._-]+|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|ConnectionStrings__|Host=.*;.*Password=|NUGET_API_KEY)'
              foreach ($entry in $entries) {
                  if ($entry.FullName -match '\.(nuspec|md|txt|xml|rels|psmdcp)$' -or $entry.FullName -in @("LICENSE", "PACKAGE_README.md")) {
                      $reader = [IO.StreamReader]::new($entry.Open())
                      try {
                          $text = $reader.ReadToEnd()
                      }
                      finally {
                          $reader.Dispose()
                      }

                      if ($text -match $secretPattern) {
                          throw "Potential secret pattern found in packaged file: $($entry.FullName)"
                      }
                  }
              }
          }
          finally {
              $zip.Dispose()
          }

      - name: Push NuGet package
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path out -Filter *.nupkg
          foreach ($pkg in $packages) {
              Write-Host "Pushing $($pkg.FullName)..."
              dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
