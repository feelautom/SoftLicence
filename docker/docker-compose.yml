services:
  licencedb:
    image: postgres:16
    container_name: licencedb
    restart: unless-stopped
    networks:
      - softlicence
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=db_softlicence
      - POSTGRES_USER=developer
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - softlicence-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U developer -d db_softlicence
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024M

  migrator:
    image: softlicence-server
    networks:
      - softlicence
    depends_on:
      licencedb:
        condition: service_healthy
    environment:
