      - DistributionS2S__Clients__0__AllowLicenseBootstrap=${DistributionS2S__Clients__0__AllowLicenseBootstrap:-false}
      - DistributionS2S__Clients__0__ProductIds__0=${DistributionS2S__Clients__0__ProductIds__0:-}
      - DistributionS2S__Clients__0__AllowedCidrs__0=${DistributionS2S__Clients__0__AllowedCidrs__0:-}
      - DistributionS2S__Clients__0__AllowedCidrs__1=${DistributionS2S__Clients__0__AllowedCidrs__1:-}
      - CanaryAck__PrivateKeyPem=${CanaryAck__PrivateKeyPem:-}
      - RetentionSettings__CleanupEnabled=true
      - RetentionSettings__AuditLogsDays=${RetentionSettings__AuditLogsDays:-30}
      - RetentionSettings__TelemetryDays=${RetentionSettings__TelemetryDays:-0}
      - RetentionSettings__CleanupIntervalHours=${RetentionSettings__CleanupIntervalHours:-24}
      - RetentionSettings__AccessLogBatchSize=${RetentionSettings__AccessLogBatchSize:-1000}
      - RetentionSettings__AccessLogMaxBatchesPerRun=${RetentionSettings__AccessLogMaxBatchesPerRun:-100}
      - RetentionSettings__AccessLogBatchDelayMilliseconds=${RetentionSettings__AccessLogBatchDelayMilliseconds:-100}
      - RetentionSettings__AccessLogRunBudgetSeconds=${RetentionSettings__AccessLogRunBudgetSeconds:-300}
      - RetentionSettings__AccessLogStatementTimeoutSeconds=${RetentionSettings__AccessLogStatementTimeoutSeconds:-30}
      - RetentionSettings__AccessLogLockTimeoutMilliseconds=${RetentionSettings__AccessLogLockTimeoutMilliseconds:-1000}
      - RetentionSettings__AccessLogPartitionHorizonDays=${RetentionSettings__AccessLogPartitionHorizonDays:-45}
      - AdminSettings__Username=${AdminSettings__Username:-admin}
      - AdminSettings__Password=${AdminSettings__Password:-CHANGE_ME_ADMIN_PASSWORD}
      - AdminSettings__ApiSecret=${AdminSettings__ApiSecret:-CHANGE_ME_RANDOM_SECRET}
      - AdminSettings__LoginPath=${AdminSettings__LoginPath:-CHANGE_ME_LOGIN_PATH}
      - AdminSettings__AllowedIps=${AdminSettings__AllowedIps:-}
      - SecuritySettings__ProtectedInfrastructureIps=${SecuritySettings__ProtectedInfrastructureIps:?SecuritySettings__ProtectedInfrastructureIps is required}
      - PrivateValidationTestReset__AllowedLicenseIds=${PrivateValidationTestReset__AllowedLicenseIds:-}
      - SmtpSettings__Host
      - SmtpSettings__Port
      - SmtpSettings__Username
      - SmtpSettings__Password
      - SmtpSettings__FromEmail
      - SmtpSettings__FromName
      - SmtpSettings__EnableSsl
      - BackupSettings__Enabled=${BackupSettings__Enabled:-false}
      - BackupSettings__RcloneRemote=${BackupSettings__RcloneRemote:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - BUGTRACE_BASE_URL=${BUGTRACE_BASE_URL:-}
      - BUGTRACE_PROJECT_TOKEN=${BUGTRACE_PROJECT_TOKEN:-}
      - BUGTRACE_PROJECT_ID=${BUGTRACE_PROJECT_ID:-}
      # Dedicated Desktop support relay: public TIAConnect product identity, not a credential.
      - BUGTRACE_SUPPORT_PRODUCT_ID=808648bc-a4b9-4f71-bcb1-b7c7e67ca98e
      - BUGTRACE_SUPPORT_PROJECT_TOKEN=${BUGTRACE_SUPPORT_PROJECT_TOKEN:-}
      - FORCE_DB_RESET=false
    restart: unless-stopped
    deploy:
      # The automatic BugTrace outbox uses process-local coordination and must remain single-replica.
      replicas: 1
      resources:
        limits:
          cpus: "0.75"
          memory: 1024M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=Docker-network"
      - "traefik.http.routers.softlicence-web.rule=Host(`softlicence.EXAMPLE.COM`) || Host(`telemetrie.EXAMPLE.COM`)"
      - "traefik.http.routers.softlicence-web.entrypoints=websecure"
      - "traefik.http.routers.softlicence-web.service=softlicence-web"
      - "traefik.http.routers.softlicence-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.softlicence-web.loadbalancer.server.port=8080"
      - "traefik.http.services.softlicence-web.loadbalancer.responseForwarding.flushInterval=-1"

networks:
  softlicence:
    driver: bridge
  Docker-network:
    external: true

volumes:
  softlicence-db-data:
    external: true
  softlicence-data:
    external: true
  softlicence-config:
    external: true
